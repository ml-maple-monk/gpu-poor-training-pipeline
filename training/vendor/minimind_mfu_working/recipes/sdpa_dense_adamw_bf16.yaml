name: sdpa_dense_adamw_bf16
description: Simple baseline recipe using SDPA attention, dense linears, AdamW, eager compile mode, and bf16 training.
model:
  batch_size: 1
  sequence_length: 4096
  hidden_size: 2048
  num_hidden_layers: 16
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 6496
  vocab_size: 50014
  max_position_embeddings: 32768
  rms_norm_eps: 0.000001
  rope_theta: 1000000.0
  dropout: 0.0
  loss_chunk_size: 1024
components:
  attention: sdpa
  sparsity: dense
  optimizer: adamw
  compile: eager
  precision: bf16_training
training:
  learning_rate: 0.0001
  weight_decay: 0.4
