pattern = "\\bRTX\\s+PRO\\s+6000\\b"
canonical_name = "RTX PRO 6000"
training_tflops = 1000.0
fp8_tflops = 2000.0

[[gpu_profiles]]
pattern = "\\bRTX\\s+6000\\s+ADA(?:\\s+GENERATION)?\\b"
